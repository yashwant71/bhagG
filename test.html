<!DOCTYPE html>
<html lang="sa">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bhagavad Gita — Shloka 1.1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  body {
    background: radial-gradient(ellipse 130% 90% at 50% 40%, #3d1e00 0%, #1e0d00 50%, #090400 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Serif Devanagari', serif;
    overflow: hidden;
  }

  #stars { position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* ── CARD ── */
  .card {
    position: relative;
    z-index: 10;
    padding: 4rem 4.5rem;
    max-width: 920px;
    width: 94vw;
    text-align: center;
  }

  /* ── SPEAKER ── */
  .speaker {
    font-size: clamp(1.6rem, 3.8vw, 2.4rem);
    font-weight: 700;
    color: #ffe066;
    letter-spacing: 0.05em;
    display: inline-block;
    position: relative;
    text-shadow: 0 0 30px rgba(255,200,50,0.5), 0 0 60px rgba(255,160,0,0.25);
  }

  /* ── DIVIDER ── */
  .divider {
    width: 55%;
    height: 1px;
    margin: 1.1rem auto 1.6rem;
    background: linear-gradient(90deg, transparent, #b07800 30%, #ffe066 50%, #b07800 70%, transparent);
    position: relative;
  }
  .divider::after {
    content: '❖';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    color: #ffe066;
    font-size: 0.75rem;
    background: #1e0d00;
    padding: 0 0.5rem;
  }

  /* ── SHLOKA TEXT ── */
  .line-wrap {
    position: relative;
    display: inline-block;
    width: 100%;
    margin: 0.15rem 0;
  }
  .line {
    font-size: clamp(1.7rem, 4.4vw, 2.85rem);
    font-weight: 700;
    line-height: 1.9;
    color: #ffe066;
    text-shadow:
      0 0 20px rgba(255,200,40,0.55),
      0 0 50px rgba(255,150,0,0.2);
    display: block;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .line.show { opacity:1; transform:translateY(0); }

  /* ── STAR FLARE pinned on text ── */
  .flare {
    position: absolute;
    pointer-events: none;
    z-index: 20;
    /* centered at the pin point */
    transform: translate(-50%, -50%) scale(0);
    animation: flare-in 0.6s cubic-bezier(.34,1.56,.64,1) forwards,
               flare-pulse 2.8s ease-in-out infinite;
  }

  @keyframes flare-in {
    to { transform: translate(-50%,-50%) scale(1); }
  }
  @keyframes flare-pulse {
    0%,100% { transform: translate(-50%,-50%) scale(1)    rotate(0deg);   opacity:1; }
    40%      { transform: translate(-50%,-50%) scale(1.35) rotate(12deg);  opacity:1; }
    70%      { transform: translate(-50%,-50%) scale(0.85) rotate(-8deg);  opacity:0.7; }
  }

  /* ── AMBIENT SPARKLE DOTS ── */
  @keyframes sdot {
    0%   { opacity:0; transform:scale(0) translateY(0); }
    30%  { opacity:1; transform:scale(1) translateY(-6px); }
    100% { opacity:0; transform:scale(0.2) translateY(-50px); }
  }
  .sdot {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    animation: sdot linear forwards;
    background: radial-gradient(circle, #ffe599 30%, transparent 70%);
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="card" id="card">
  <p class="speaker" id="speaker">धृतराष्ट्र उवाच</p>
  <div class="divider"></div>

  <div class="line-wrap" id="wrap1">
    <span class="line" id="l1">धर्मक्षेत्रे कुरूक्षेत्रे समवेता युयुत्सवः।</span>
  </div>
  <div class="line-wrap" id="wrap2">
    <span class="line" id="l2">मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय॥</span>
  </div>

  <div class="divider" style="margin-top:1.8rem;"></div>
</div>

<script>
/* ══ STARFIELD ══ */
const cv=document.getElementById('stars'), cx=cv.getContext('2d');
let W,H,pts=[],shoots=[];
function sz(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
sz(); addEventListener('resize',sz);
function rand(a,b){return a+Math.random()*(b-a);}
function mkPts(){pts=[];for(let i=0;i<320;i++)pts.push({x:rand(0,W),y:rand(0,H),r:rand(.3,1.8),ph:rand(0,Math.PI*2),sp:rand(.4,2),warm:Math.random()>.6});}
mkPts();
function mkShoot(){shoots.push({x:rand(W*.05,W*.8),y:rand(H*.02,H*.3),len:rand(80,190),life:0,max:rand(35,75),ang:rand(20,42)});}
setInterval(mkShoot,2500); mkShoot();
let fr=0;
(function loop(){
  cx.clearRect(0,0,W,H);
  const t=fr*0.013;
  pts.forEach(p=>{
    const a=.12+.88*(.5+.5*Math.sin(p.ph+t*p.sp));
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=p.warm?'#ffe599':'#fff';cx.globalAlpha=a;cx.fill();
  });
  shoots=shoots.filter(s=>s.life<s.max);
  shoots.forEach(s=>{
    s.life++;const pr=s.life/s.max,rad=s.ang*Math.PI/180;
    const hx=s.x+s.len*pr*Math.cos(rad),hy=s.y+s.len*pr*Math.sin(rad);
    const tx=s.x+s.len*Math.max(0,pr-.28)*Math.cos(rad),ty=s.y+s.len*Math.max(0,pr-.28)*Math.sin(rad);
    const g=cx.createLinearGradient(tx,ty,hx,hy);
    g.addColorStop(0,'rgba(255,220,80,0)');g.addColorStop(1,`rgba(255,240,160,${(1-pr)*.9})`);
    cx.beginPath();cx.moveTo(tx,ty);cx.lineTo(hx,hy);
    cx.strokeStyle=g;cx.lineWidth=1.4;cx.globalAlpha=1-pr*.4;cx.stroke();
  });
  cx.globalAlpha=1; fr++; requestAnimationFrame(loop);
})();

/* ══ AMBIENT SPARKLE DOTS ══ */
setInterval(()=>{
  const el=document.createElement('div');
  el.className='sdot';
  const s=3+Math.random()*5;
  el.style.cssText=`width:${s}px;height:${s}px;left:${8+Math.random()*84}vw;top:${10+Math.random()*80}vh;
    box-shadow:0 0 ${s*2}px ${s}px rgba(255,210,60,.55);
    animation-duration:${1.3+Math.random()*2}s;`;
  document.body.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
},320);

/* ══ BUILD STAR FLARE SVG ══ */
function makeFlareSVG(size, opacity){
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox','0 0 60 60');
  svg.style.opacity = opacity;

  // long cross arms
  const lines=[
    [30,2,30,58],   // vertical
    [2,30,58,30],   // horizontal
    [10,10,50,50],  // diag
    [50,10,10,50],  // diag
  ];
  const widths=[2.5,2.5,1.2,1.2];
  lines.forEach(([x1,y1,x2,y2],i)=>{
    const line=document.createElementNS(ns,'line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke','#ffe066');
    line.setAttribute('stroke-width',widths[i]);
    line.setAttribute('stroke-linecap','round');
    // fade towards tips
    const grad=document.createElementNS(ns,'linearGradient');
    const gid='g'+Math.random().toString(36).slice(2);
    grad.setAttribute('id',gid);
    grad.setAttribute('x1',x1/60);grad.setAttribute('y1',y1/60);
    grad.setAttribute('x2',x2/60);grad.setAttribute('y2',y2/60);
    grad.setAttribute('gradientUnits','objectBoundingBox');
    [['0','rgba(255,240,180,0)'],['0.45','rgba(255,240,180,1)'],['0.55','rgba(255,240,180,1)'],['1','rgba(255,240,180,0)']].forEach(([o,c])=>{
      const stop=document.createElementNS(ns,'stop');
      stop.setAttribute('offset',o);stop.setAttribute('stop-color',c);
      grad.appendChild(stop);
    });
    const defs=svg.querySelector('defs')||document.createElementNS(ns,'defs');
    if(!svg.querySelector('defs')) svg.insertBefore(defs, svg.firstChild);
    defs.appendChild(grad);
    line.setAttribute('stroke',`url(#${gid})`);
    svg.appendChild(line);
  });

  // bright core dot
  const core=document.createElementNS(ns,'circle');
  core.setAttribute('cx',30);core.setAttribute('cy',30);core.setAttribute('r',3);
  core.setAttribute('fill','#fffde0');
  svg.appendChild(core);

  // soft glow circle behind
  const glow=document.createElementNS(ns,'circle');
  glow.setAttribute('cx',30);glow.setAttribute('cy',30);glow.setAttribute('r',8);
  glow.setAttribute('fill','rgba(255,220,80,0.18)');
  svg.insertBefore(glow, core);

  return svg;
}

/* ══ PIN FLARES ONTO TEXT ══ */
// We place flares at specific % positions along each text line
// so they sit right on the letterforms
const flarePositions = [
  // speaker line
  { refId:'speaker', x:0.02, y:0.1, size:32, opacity:0.95, delay:500 },
  { refId:'speaker', x:0.98, y:0.1, size:28, opacity:0.85, delay:700 },

  // line 1 — on "धर्म" start, on "कुरू" middle, end of line
  { refId:'wrap1', x:0.01, y:0.45, size:36, opacity:1,    delay:900  },
  { refId:'wrap1', x:0.42, y:0.2,  size:24, opacity:0.8,  delay:1100 },
  { refId:'wrap1', x:0.99, y:0.5,  size:30, opacity:0.9,  delay:1300 },

  // line 2
  { refId:'wrap2', x:0.01, y:0.45, size:34, opacity:0.95, delay:1200 },
  { refId:'wrap2', x:0.55, y:0.2,  size:22, opacity:0.75, delay:1500 },
  { refId:'wrap2', x:0.985,y:0.55, size:30, opacity:0.9,  delay:1700 },
];

function pinFlares(){
  flarePositions.forEach(({refId, x, y, size, opacity, delay})=>{
    setTimeout(()=>{
      const ref=document.getElementById(refId);
      if(!ref) return;
      const rect=ref.getBoundingClientRect();
      const cardRect=document.getElementById('card').getBoundingClientRect();

      const flare=makeFlareSVG(size, opacity);
      flare.className='flare';
      // position relative to card
      flare.style.left = (rect.left - cardRect.left + rect.width  * x) + 'px';
      flare.style.top  = (rect.top  - cardRect.top  + rect.height * y) + 'px';
      // random infinite pulse offset
      flare.style.animationDelay = `0s, ${(Math.random()*1.5).toFixed(2)}s`;

      document.getElementById('card').appendChild(flare);
    }, delay);
  });
}

/* ══ REVEAL SEQUENCE ══ */
setTimeout(()=>{
  document.getElementById('l1').classList.add('show');
},300);
setTimeout(()=>{
  document.getElementById('l2').classList.add('show');
},700);
setTimeout(pinFlares, 800);
</script>
</body>
</html>
